<section class="hero">
  <div class="hero__inner">
    <div class="hero__content">
      <span class="badge">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
        New Arrivals
      </span>

      <h1 class="hero__title">
        {{ title }} <br />
        of <span class="hero__highlight">{{ highlight }}</span>
      </h1>

      <p class="hero__text">{{ description }}</p>

      <div class="hero__actions">
        <a href="#" class="btn btn--primary">
          Shop Now
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 5l7 7-7 7" />
          </svg>
        </a>
        <a href="#" class="btn btn--outline">View New Arrivals</a>
      </div>

      <ul class="stats">
        <li><strong>10k+</strong><span>Products</span></li>
        <li><strong>50+</strong><span>Top brands</span></li>
        <li><strong>24/7</strong><span>Support</span></li>
      </ul>
    </div>

    <div class="hero__visual">
      <svg class="headphones" viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Headphones illustration">
        <defs>
          <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="1" stop-color="#b9bcc4" />
          </linearGradient>
          <linearGradient id="cushion" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f4a96a" />
            <stop offset="1" stop-color="#c9702f" />
          </linearGradient>
          <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="1" stop-color="#cfd2d9" />
          </linearGradient>
        </defs>


        <path d="M92 250 C92 60 308 60 308 250" fill="none" stroke="url(#band)" stroke-width="28" stroke-linecap="round" />


        <rect x="58" y="215" width="76" height="150" rx="36" fill="url(#cup)" />
        <rect x="38" y="238" width="46" height="104" rx="23" fill="url(#cushion)" />

        
        <rect x="266" y="215" width="76" height="150" rx="36" fill="url(#cup)" />
        <rect x="316" y="238" width="46" height="104" rx="23" fill="url(#cushion)" />


        <circle cx="96" cy="290" r="10" fill="#9ea2ab" opacity="0.5" />
        <circle cx="304" cy="290" r="10" fill="#9ea2ab" opacity="0.5" />
      </svg>

      @for (chip of chips; track chip.label) {
        <div class="chip chip--{{ chip.position }}">
          <span class="chip__dot"></span>
          {{ chip.label }}
        </div>
      }
    </div>
  </div>
</section>
